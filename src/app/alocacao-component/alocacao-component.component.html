<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<div class="d-flex justify-content-center mt-5">
  <div class="col-10 col-md-8 col-lg-6">
    <form #reservaForm="ngForm">
      <div class="card shadow-lg rounded-3">
        <div class="header-card">
          <h5 class="mb-0">Reserva de Ambiente</h5>
        </div>

        <div class="card-body">
          <div class="mb-3">
            <label for="data" class="form-label">Selecione a Data</label>
            <input
              type="date"
              class="form-control"
              id="data"
              [(ngModel)]="formData.data"
              name="data"
              required
            />
          </div>

          <div class="mb-3">
            <label for="notebook" class="form-label"
              >Vai querer notebook?</label
            >
            <select
              class="form-select"
              id="notebook"
              [(ngModel)]="formData.notebook"
              name="notebook"
              required
            >
              <option value="" disabled selected>Selecione...</option>
              <option value="sim">Sim</option>
              <option value="nao">Não</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label d-block">Tipo de Ambiente</label>
            <div class="d-flex gap-4">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  id="sala"
                  name="tipo"
                  [(ngModel)]="formData.tipo"
                  value="sala"
                  required
                />
                <label class="form-check-label" for="sala">Sala</label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  id="laboratorio"
                  name="tipo"
                  [(ngModel)]="formData.tipo"
                  value="laboratorio"
                  required
                />
                <label class="form-check-label" for="laboratorio"
                  >Laboratório</label
                >
              </div>
            </div>
          </div>
        </div>

        <div class="card-footer text-end">
          <button
            type="submit"
            class="btn btn-primary"
            (click)="enviarFormulario()"
          >
            Enviar
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
